<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16324F">
<title>Navin Day Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- मुख्य कंटेनर जिथे प्रत्येक टॅब पूर्ण पान व्यापेल -->
<main id="app-main">

  <!-- १. TODAY व्ह्यू: फक्त Today निवडल्यावरच हे सर्व दिसेल -->
  <section id="today-view" class="view active">
    <div class="view-header">
      <div class="brand-title">Navin Day Planner</div>
      <div class="today-datebar">
        <span id="today-date">—</span> • <span id="current-time">—</span>
      </div>
      <div class="search-box">
        <input type="search" id="global-search" placeholder="Search tasks, notes...">
      </div>
      <div class="today-tabs">
        <button class="today-tab active" data-tab="schedule">Schedule (<span id="tabcount-schedule">0</span>)</button>
        <button class="today-tab" data-tab="important">Important (<span id="tabcount-important">0</span>)</button>
        <button class="today-tab" data-tab="pending">Carry Fwd (<span id="tabcount-pending">0</span>)</button>
        <button class="today-tab" data-tab="completed">Done (<span id="tabcount-completed">0</span>)</button>
      </div>
    </div>
    <div class="view-content">
      <div id="today-tile-grid"></div>
    </div>
  </section>

  <!-- २. CALENDAR व्ह्यू -->
  <section id="calendar-view" class="view">
    <div class="view-header">
      <h2>Calendar</h2>
    </div>
    <div class="view-content" id="calendar-content"></div>
  </section>

  <!-- ३. TASKS व्ह्यू -->
  <section id="tasks-view" class="view">
    <div class="view-header">
      <h2>All Tasks</h2>
    </div>
    <div class="view-content" id="tasks-content"></div>
  </section>

  <!-- ४. COMPLETED व्ह्यू -->
  <section id="completed-view" class="view">
    <div class="view-header">
      <h2>Completed Tasks</h2>
    </div>
    <div class="view-content" id="completed-content"></div>
  </section>

  <!-- ५. SETTINGS व्ह्यू: वरचे सर्व गायब होऊन फक्त हे पूर्ण पानभर दिसेल -->
  <section id="settings-view" class="view">
    <div class="view-header">
      <h2>Settings & Backup</h2>
    </div>
    <div class="view-content" id="settings-content"></div>
  </section>

</main>

<!-- फ्लोटिंग ॲड बटण (+) -->
<button id="fab-add" class="fab" aria-label="Add task">+</button>

<!-- खालचा नॅव्हिगेशन बार -->
<nav class="bottom-nav">
  <button data-tab="today" class="active"><span class="nav-icon">🏠</span><span>Today</span></button>
  <button data-tab="calendar"><span class="nav-icon">📅</span><span>Calendar</span></button>
  <button data-tab="tasks"><span class="nav-icon">📝</span><span>Tasks</span></button>
  <button data-tab="completed"><span class="nav-icon">✓</span><span>Completed</span></button>
  <button data-tab="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
</nav>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="utils.js"></script>
<script src="categories.js"></script>
<script src="tasks.js"></script>
<script src="ui.js"></script>
<script src="calendar.js"></script>
<script src="notifications.js"></script>
<script src="alarms.js"></script>
<script src="backup.js"></script>
<script src="google-drive.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
